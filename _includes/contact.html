<!-- SECTION 4: Contact -->
<section id="contact" class="contact-section" aria-labelledby="contact-heading">
    <h2 id="contact-heading">Contact Me</h2>
    <p>Interested in my work or have an opportunity to share? I'd love to hear from you.</p>
    <div class="contact-links">
        <a href="mailto:{{ site.contact-email | escape }}" class="contact-email">
            <i class="fa-solid fa-envelope" aria-hidden="true"></i>
            <span>{{ site.contact-email | escape }}</span>
        </a>
        <a href="https://www.linkedin.com/in/{{ site.external-links.linkedin }}/" target="_blank" rel="noopener noreferrer">
            <i class="fa-brands fa-linkedin" aria-hidden="true"></i>
            <span>Connect on LinkedIn</span>
        </a>
    </div>
    <p class="contact-note">The email link opens your email app. You can also copy the address above.</p>
</section>
