---
layout: wrapper
---

<main class="post-view">
    <div class="summary">
        
       
        {% assign page_url_base = page.url | remove: 'index' | remove: '.html' %}
        {% assign image_path = page_url_base | append: page['main-image'] %}
        <img src="{{ image_path }}" alt="{{ page.title }} — project overview image">
        
        <div class="title-header">
            <h1>{{page.title}}</h1>
        </div>
        
        <div class="project-description">
            <h2>Overview</h2>
            <p>{{ page.description }}</p>
        </div>
        <div class="skills-card">
            <h2>Skills used</h2>
            <div class="skills-list">
                {% for skill in page.skills %}
                <span class="skill">{{ skill }}</span>    
                {% endfor %}
            </div>
        </div>
    </div>
      
    <div class="content">
        {{content}}
    </div>
</main>
